[project]
name = "multimodal-book-recommender"
version = "0.1.0"
description = "A multimodal content-based book recommendation system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pillow>=12.3.0",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "qdrant-client>=1.20.0",
    "requests>=2.34.2",
    "streamlit>=1.67.0",
    "torch>=2.15.0",
    "transformers>=5.22.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/book_recommender"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "slow: real CLIP model + real data (run with: pytest -m slow)",
]

[tool.ruff]
line-length = 88
target-version = "py311"
